<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Obsidian Content Admin</title><style>body{background:#09080d;color:#eee;font:14px system-ui;margin:0;padding:28px}main{margin:auto;max-width:1100px}h1{margin:0 0 6px}p{color:#aaa}textarea{background:#111018;border:1px solid #3b3150;border-radius:10px;color:#e9e3f5;font:13px ui-monospace,monospace;min-height:65vh;padding:16px;resize:vertical;width:100%;box-sizing:border-box}button{background:#8b4dff;border:0;border-radius:8px;color:white;font-weight:700;margin-top:12px;padding:11px 18px}#status{margin-left:12px}</style></head>
<body><main><h1>Contenido de Obsidian Studios</h1><p>Editor local del manifiesto. Valida antes de guardar y no publica nada.</p><textarea id="editor" spellcheck="false"></textarea><div><button id="save">Validar y guardar</button><span id="status"></span></div></main><script>const token=new URLSearchParams(location.search).get('token');const api=p=>p+'?token='+encodeURIComponent(token);const editor=document.querySelector('#editor');const status=document.querySelector('#status');fetch(api('/api/content')).then(r=>r.json()).then(v=>editor.value=JSON.stringify(v,null,2)).catch(e=>status.textContent=e.message);document.querySelector('#save').onclick=async()=>{try{status.textContent='Validando...';const value=JSON.parse(editor.value);const response=await fetch(api('/api/content'),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(value)});const result=await response.json();if(!response.ok)throw new Error((result.errors||[result.error]).join(' · '));status.textContent='Guardado. No se ha publicado.';editor.value=JSON.stringify({...value,generated_at:result.generated_at},null,2)}catch(e){status.textContent='Error: '+e.message}};</script></body></html>
