name: Validate launcher content

on:
  pull_request:
    paths:
      - "content/**"
      - "scripts/content-tool.js"
  push:
    paths:
      - "content/**"
      - "scripts/content-tool.js"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/content-tool.js validate
